
server.port=8080

# Configuracion de Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:insecure_pay_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web H2 deshabilitada (habilitar solo temporalmente para tomar evidencias)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate & JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Sin fuga de trazas ni detalles internos ante errores (CWE-209)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Secreto JWT externalizado: se lee de la variable de entorno JWT_SECRET
# (sin valor por defecto: si no esta definida, el backend no arranca)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000